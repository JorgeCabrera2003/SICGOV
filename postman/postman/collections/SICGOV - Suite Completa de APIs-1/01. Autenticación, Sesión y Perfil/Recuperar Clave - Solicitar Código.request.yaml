$kind: http-request
description: Envía código de 6 dígitos al correo registrado.
url: "{{base_url}}?page=RecuperacionClave&page=recuperar-password"
method: POST
headers:
  X-Requested-With: XMLHttpRequest
queryParams:
  - key: page
    value: RecuperacionClave
  - key: page
    value: recuperar-password
body:
  type: urlencoded
  content:
    peticion: recuperar
    correo: admin@goodvibes.com
scripts:
  - type: afterResponse
    code: |-
      pm.test("Respuesta exitosa o procesada", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 204, 400, 401, 403]);
      });
      if (pm.response.headers.get('Content-Type') && pm.response.headers.get('Content-Type').includes('application/json')) {
          pm.test("Formato JSON válido", function () {
              var jsonData = pm.response.json();
              pm.expect(jsonData).to.be.an('object');
          });
      }
    language: text/javascript
order: 5000
