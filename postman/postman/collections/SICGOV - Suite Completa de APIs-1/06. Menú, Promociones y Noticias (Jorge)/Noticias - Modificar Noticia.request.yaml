$kind: http-request
url: "{{base_url}}?page=Noticia"
method: POST
headers:
  X-Requested-With: XMLHttpRequest
queryParams:
  page: Noticia
body:
  type: urlencoded
  content:
    peticion: modificar
    id_noticia: NOTC20261022120000001
    titulo: Terraza VIP Abierta al Público
    subtitulo: Reservaciones disponibles
    contenido: Horarios extendidos los fines de semana.
    tipo: INFO
scripts:
  - type: afterResponse
    code: |-
      pm.test("Respuesta exitosa o procesada", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 204, 400, 401, 403]);
      });
      if (pm.response.headers.get('Content-Type') && pm.response.headers.get('Content-Type').includes('application/json')) {
          pm.test("Formato JSON válido", function () {
              var jsonData = pm.response.json();
              pm.expect(jsonData).to.be.an('object');
          });
      }
    language: text/javascript
order: 13000
