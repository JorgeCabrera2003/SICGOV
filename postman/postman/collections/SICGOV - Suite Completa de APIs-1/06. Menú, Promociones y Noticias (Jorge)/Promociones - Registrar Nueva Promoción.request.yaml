$kind: http-request
url: "{{base_url}}?page=Promocion"
method: POST
headers:
  X-Requested-With: XMLHttpRequest
queryParams:
  page: Promocion
body:
  type: urlencoded
  content:
    peticion: registrar
    nombre: Súper Combo 2x1 Burguer
    tipo_descuento: PORCENTAJE
    valor_descuento: "20"
    descripcion: 20% de descuento en la segunda hamburguesa clásica.
    fecha_inicio: 2026-11-04
    fecha_fin: 2026-11-19
    hora_inicio: 12:00
    hora_fin: 22:00
    productos: '[{"id":"PROD001","cantidad":2}]'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Respuesta exitosa o procesada", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 204, 400, 401, 403]);
      });
      if (pm.response.headers.get('Content-Type') && pm.response.headers.get('Content-Type').includes('application/json')) {
          pm.test("Formato JSON válido", function () {
              var jsonData = pm.response.json();
              pm.expect(jsonData).to.be.an('object');
          });
      }
    language: text/javascript
order: 7000
