$kind: http-request
description: Actualiza la contraseña del usuario tras verificar el código.
url: "{{base_url}}?page=RecuperacionClave&page=restablecer-password"
method: POST
headers:
  X-Requested-With: XMLHttpRequest
queryParams:
  - key: page
    value: RecuperacionClave
  - key: page
    value: restablecer-password
body:
  type: urlencoded
  content:
    peticion: restablecer
    clave: NuevaClave2026*
    rclave: NuevaClave2026*
scripts:
  - type: afterResponse
    code: |-
      pm.test("Respuesta exitosa o procesada", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 204, 400, 401, 403]);
      });
      if (pm.response.headers.get('Content-Type') && pm.response.headers.get('Content-Type').includes('application/json')) {
          pm.test("Formato JSON válido", function () {
              var jsonData = pm.response.json();
              pm.expect(jsonData).to.be.an('object');
          });
      }
    language: text/javascript
order: 7000
