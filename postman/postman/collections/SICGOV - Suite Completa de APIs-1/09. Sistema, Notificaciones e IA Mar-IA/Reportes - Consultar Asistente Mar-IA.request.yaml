$kind: http-request
description: Interactúa con el microservicio inteligente Mar-IA para extraer análisis de datos.
url: "{{base_url}}?page=Reporte"
method: POST
headers:
  X-Requested-With: XMLHttpRequest
queryParams:
  page: Reporte
body:
  type: urlencoded
  content:
    peticion: mar_ia
    mensaje: ¿Cuáles fueron los 3 productos más vendidos esta semana?
scripts:
  - type: afterResponse
    code: |-
      pm.test("Respuesta exitosa o procesada", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 204, 400, 401, 403]);
      });
      if (pm.response.headers.get('Content-Type') && pm.response.headers.get('Content-Type').includes('application/json')) {
          pm.test("Formato JSON válido", function () {
              var jsonData = pm.response.json();
              pm.expect(jsonData).to.be.an('object');
          });
      }
    language: text/javascript
order: 3000
