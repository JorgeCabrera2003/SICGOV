$kind: http-request
description: Valida el código de seguridad de 6 dígitos.
url: "{{base_url}}?page=RecuperacionClave&page=verificar-codigo"
method: POST
headers:
  X-Requested-With: XMLHttpRequest
queryParams:
  - key: page
    value: RecuperacionClave
  - key: page
    value: verificar-codigo
body:
  type: urlencoded
  content:
    peticion: verificar
    codigo: "123456"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Respuesta exitosa o procesada", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 204, 400, 401, 403]);
      });
      if (pm.response.headers.get('Content-Type') && pm.response.headers.get('Content-Type').includes('application/json')) {
          pm.test("Formato JSON válido", function () {
              var jsonData = pm.response.json();
              pm.expect(jsonData).to.be.an('object');
          });
      }
    language: text/javascript
order: 6000
